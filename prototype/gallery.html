<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goa 2025 — Memories</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Albums
    </a>
    <div class="nav__spacer"></div>
    <nav class="nav__links">
      <button class="btn btn--ghost btn--sm" data-copy="https://memories.app/share/goa-2025-x7k9">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4M12 2v14"/></svg>
        <span data-copy-label>Copy link</span>
      </button>
      <img class="avatar" src="https://picsum.photos/seed/mem-user/80/80" alt="Your profile" />
    </nav>
  </div>
</header>

<!-- Album header -->
<section class="pagehead">
  <div class="container">
    <div class="pagehead__row reveal">
      <div>
        <p class="eyebrow">Album · Shared with 6 people</p>
        <h1>Goa 2025</h1>
        <p class="muted" style="margin-top: 6px;">128 photos · Created May 2025</p>
      </div>
      <div style="display: flex; gap: var(--s1);">
        <button class="btn btn--outline btn--sm" data-photo-first>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          Slideshow
        </button>
        <button class="btn btn--ghost btn--sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add photos
        </button>
      </div>
    </div>
  </div>
</section>

<main class="section--tight" style="padding-top: var(--s2);">
  <div class="container">

    <!-- Tabs -->
    <div class="toolbar reveal" data-tabs>
      <div class="segmented" role="tablist">
        <button data-tab="all" aria-selected="true" role="tab">All photos</button>
        <button data-tab="collections" aria-selected="false" role="tab">Collections</button>
      </div>
      <div class="spacer"></div>
      <span class="tiny">Click any photo to open · use ← → keys · Space to play</span>
    </div>

    <!-- All photos -->
    <div data-panel="all">
      <div class="masonry">
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g1/1600/1100" data-caption="Sunset at Palolem beach"><img src="https://picsum.photos/seed/g1/640/440" alt="Sunset at Palolem beach" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g2/1100/1500" data-caption="Old Portuguese church"><img src="https://picsum.photos/seed/g2/640/870" alt="Old Portuguese church" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g3/1500/1000" data-caption="The whole gang at lunch"><img src="https://picsum.photos/seed/g3/640/430" alt="The whole gang at lunch" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g4/1200/1200" data-caption="Beach shack breakfast"><img src="https://picsum.photos/seed/g4/640/640" alt="Beach shack breakfast" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g5/1100/1450" data-caption="Scooter ride to the fort"><img src="https://picsum.photos/seed/g5/640/840" alt="Scooter ride to the fort" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g6/1600/1050" data-caption="Aguada fort viewpoint"><img src="https://picsum.photos/seed/g6/640/420" alt="Aguada fort viewpoint" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g7/1300/1000" data-caption="Coconut water break"><img src="https://picsum.photos/seed/g7/640/490" alt="Coconut water break" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g8/1100/1400" data-caption="Night market lights"><img src="https://picsum.photos/seed/g8/640/810" alt="Night market lights" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g9/1500/1100" data-caption="Boat to the dolphins"><img src="https://picsum.photos/seed/g9/640/470" alt="Boat to the dolphins" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g10/1200/1500" data-caption="Palm trees at dusk"><img src="https://picsum.photos/seed/g10/640/800" alt="Palm trees at dusk" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g11/1600/1050" data-caption="Sandcastle competition"><img src="https://picsum.photos/seed/g11/640/420" alt="Sandcastle competition" loading="lazy" /></figure>
        <figure class="photo reveal" data-photo data-full="https://picsum.photos/seed/g12/1200/1200" data-caption="Last morning swim"><img src="https://picsum.photos/seed/g12/640/640" alt="Last morning swim" loading="lazy" /></figure>
      </div>
    </div>

    <!-- Collections -->
    <div data-panel="collections" hidden>
      <div class="albums">
        <a class="album" href="#">
          <div class="album__cover"><img src="https://picsum.photos/seed/g4/600/450" alt="The Whole Group" loading="lazy" /><span class="album__count">38</span></div>
          <div class="album__body"><h3>The Whole Group</h3><p>People · 38 photos</p></div>
        </a>
        <a class="album" href="#">
          <div class="album__cover"><img src="https://picsum.photos/seed/g6/600/450" alt="Beaches" loading="lazy" /><span class="album__count">52</span></div>
          <div class="album__body"><h3>Beaches</h3><p>Places · 52 photos</p></div>
        </a>
        <a class="album" href="#">
          <div class="album__cover"><img src="https://picsum.photos/seed/g8/600/450" alt="Food &amp; Nights" loading="lazy" /><span class="album__count">26</span></div>
          <div class="album__body"><h3>Food &amp; Nights</h3><p>Moments · 26 photos</p></div>
        </a>
        <a class="album album--new" href="#">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><div style="font-weight:500;">New collection</div></div>
        </a>
      </div>
    </div>

  </div>
</main>

<!-- Lightbox / slideshow -->
<div class="lb" id="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
  <div class="lb__bar">
    <button class="lb__btn" data-lb="play" title="Play slideshow (Space)">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7 5 19 12 7 19 7 5"/></svg>
    </button>
    <span class="lb__counter">1 / 1</span>
    <div class="spacer"></div>
    <button class="lb__btn" data-lb="close" title="Close (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button class="lb__btn lb__nav lb__nav--prev" data-lb="prev" title="Previous (←)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="lb__btn lb__nav lb__nav--next" data-lb="next" title="Next (→)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div class="lb__stage">
    <img class="lb__img" src="" alt="" />
  </div>
  <div class="lb__caption"></div>
</div>

<script src="assets/app.js"></script>
<script>
  // "Slideshow" button opens the lightbox at the first photo and starts playing
  document.querySelector("[data-photo-first]")?.addEventListener("click", function () {
    document.querySelector("[data-photo]")?.click();
    setTimeout(function () { document.querySelector("[data-lb='play']")?.click(); }, 200);
  });
</script>
</body>
</html>
